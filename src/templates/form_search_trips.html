<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search for trips</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='time-plan.css') }}">
</head>
<body>
<div class="container">
<div class="main-content">
<h1>Find RWGPS Trip to Analyze</h1>

<form action="{{ url_for('form_search_trips_respond') }}" method="post">
  <label for="trip_name">Name (partial match):</label>
  <input type="text" id="trip_name" name="trip_name" size="60">
  <br />
  <label for="min_km">Minimum distance in kilometers:</label>
  <input type="number" id="min_km" name="min_km" value="0"><br />
  <label for="max_km">Maximum distance in kilometers:</label>
  <input type="number" id="max_km" name="max_km" value="10000"><br />
  <input type="submit" value="Search">
</form>
</div></div>
</body>
</html>
