[project]
name = "time-plan"
version = "0.1.0"
description = "Correlate RWGOPS trip records with routes to associate times with cues"
readme = "README.md"
authors = [
    { name = "Michal Young", email = "michal.young@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "geopy>=2.5.0",
    "gpxpy>=1.6.2",
    "gunicorn>=26.0.0",
    "haversine>=2.9.0",
    "numpy>=2.2.6",
    "pykdtree>=1.4.3",
    "requests>=2.34.2",
]

[project.scripts]
time-plan = "time_plan:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
